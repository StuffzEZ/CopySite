<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Copy Text Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f0f0f;
      color: white;
    }

    .box {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
    }

    button {
      margin: 8px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4caf50;
      color: white;
    }

    button:hover {
      background: #45a049;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    .text {
      margin-top: 10px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="box">
  <h3>Copy Tool</h3>

  <button onclick="copyText()">Copy Text</button>
  <button onclick="openModal()">Show Text</button>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h4>Text</h4>
    <div id="text" class="text">Loading...</div>
    <br/>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const text = params.get("text") || "No text provided";

  document.getElementById("text").innerText = text;

  function copyText() {
    navigator.clipboard.writeText(text)
      .then(() => alert("Copied!"))
      .catch(() => alert("Failed to copy"));
  }

  function openModal() {
    document.getElementById("modal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  // close when clicking outside box
  window.onclick = function(e) {
    const modal = document.getElementById("modal");
    if (e.target === modal) {
      modal.style.display = "none";
    }
  }
</script>

</body>
</html>
